name: claude-ja
description: Claude Code built-in commands,skills,agents
color: amber  # 16進コードも使用可能 例: "#FF6B35"
references:
  - https://code.claude.com/docs/en/commands
  - https://code.claude.com/docs/en/skills#bundled-skills
  - https://code.claude.com/docs/en/sub-agents#built-in-subagents

commands:
  - name: add-dir
    description: 現在のセッションにファイルアクセス用の作業ディレクトリを追加する。パスを途中まで入力すると候補が表示され、Tab で確定できる。追加したディレクトリ配下の .claude/ 設定はほとんど読み込まれない。追加に成功すると DirectoryAdded フックが実行される
    argument-hint: "<path>"
  - name: advisor
    description: "タスク中の重要な局面で2つ目のモデルに助言を求めるadvisorツールを有効化/無効化する。fable、opus、sonnet、またはフルモデルIDを指定可能。fable の指定には Fable 5 へのアクセス権が必要。引数なしでピッカーを開く"
    argument-hint: "[model|off]"
  - name: agents
    description: "サブエージェントの作成・管理を Claude に依頼するか、.claude/agents/ または ~/.claude/agents/ のファイルを直接編集するよう促すリマインダーを表示する。旧バージョンでは対話的な管理インターフェースを開いていた"
  - name: artifacts
    description: "公開済み・共有されている Artifacts を一覧表示する。Ctrl+] でも直近の Artifact を開ける"
  - name: autocompact
    description: "自動コンパクトのしきい値を設定する。コンテキストウィンドウがどこまで埋まったら Claude Code が自動的にコンパクトを実行するかを指定する。500k のようなサイズを渡すか、`auto` でモデルに合わせた既定値に戻す。指定した値はユーザー設定に保存され、現在のセッションにも即座に適用される。引数なしで実行すると現在のしきい値を表示するダイアログを開く。v2.1.221 以降が必要"
    argument-hint: "[auto|<tokens>]"
  - name: autofix-pr
    description: 現在のブランチのPRを監視し、CIが失敗したりレビューコメントが付いたら自動で修正をプッシュするClaude Code Webセッションを起動する。チェックアウト中のブランチからオープンなPRを検出するため、別のPRを監視したいときは先にそのブランチへ切り替える。デフォルトではCIの失敗とレビューコメントをすべて修正するよう指示されるが、プロンプトを渡せば別の指示を与えられる。gh CLI と Claude Code Web へのアクセスが必要
    argument-hint: "[prompt]"
  - name: background
    description: "現在のセッションをバックグラウンドエージェントとしてデタッチし、ターミナルを解放する。プロンプトを渡すとデタッチ前に追加の指示を送信できる。デタッチしたセッションは `claude agents` で監視できる。このセッションを動かしたまま会話を新しいバックグラウンドセッションにコピーするには /fork を使う。エイリアス: /bg"
    argument-hint: "[prompt]"
  - name: branch
    description: 現在の会話のこの時点でブランチを作成し、今の会話を失わずに別の方向を試せるようにする。作成したブランチに切り替わり、元の会話は保持されて /resume から戻れる。自分が切り替わらずにコピーを独立したバックグラウンドセッションとして動かしたい場合は /fork、結果がこの会話に戻ってくるサブエージェントに脇作業を任せたい場合は /subtask を使う
    argument-hint: "[name]"
  - name: brief
    description: brief モードを切り替える。通常のアシスタント応答ではなく専用のメッセージツール経由で返答するようになる
  - name: btw
    description: 会話に追加せずに素早くサイドクエスチョンをする。質問を省略すると、このセッションで直近に尋ねたサイドクエスチョンのオーバーレイを再度開き、過去の回答をたどれる。まだサイドクエスチョンが無い場合は使い方の1行が表示される
    argument-hint: "[question]"
  - name: bug
    description: "バグを報告する、または会話を共有する。送信前にセッション履歴をどこまで含めるかを選び、同意画面で確認する。ファーストパーティ接続でAnthropicにサインインしている場合はAnthropicへ送信され、サードパーティプロバイダー利用時やAnthropicの認証情報がない場合は ~/.claude/feedback-bundles/ 配下のローカルアーカイブに書き出され、自分で転送する。VS Code 拡張では拡張機能側のフィードバックダイアログが開く（v2.1.229 以降）。エイリアス: /share"
    argument-hint: "[report]"
  - name: cd
    description: "このセッションを新しい作業ディレクトリに移動する。会話のプロンプトキャッシュは保持され、システムプロンプトを再構築する代わりに新ディレクトリのCLAUDE.mdが追加される。セッションは移動先ディレクトリのプロジェクトストレージに移るため、--resume や --continue はそちらから見つけられる。v2.1.223以降は claude --resume <session-id> で他のどのディレクトリからでも移動後のセッションを見つけられる。未使用のディレクトリでは信頼するかを確認され、移動先は Cd の permission ルールで制限・無効化できる。パスを途中まで入力すると候補が表示され、Tab で確定できる。セッションを移動せず追加ディレクトリへのアクセスを付与するには /add-dir を使用"
    argument-hint: "<path>"
  - name: chrome
    description: Claude in Chromeの設定を行う
  - name: clear
    description: "空のコンテキストで新しい会話を開始する。名前を渡すと /resume ピッカー上で直前の会話にラベルが付く。同じ会話を続けたままコンテキストを解放したい場合は /compact を使う。直前の会話は /resume で再開できるほか、同じ Claude Code プロセス内なら rewind メニューの前セッション項目からも復元できる。エイリアス: /reset, /new"
    argument-hint: "[name]"
  - name: color
    description: "現在のセッションのプロンプトバーの色を設定する。使用可能な色: red, blue, green, yellow, purple, orange, pink, cyan。`default` でリセット、引数なしでランダムな色を選択。Remote Control 接続中は claude.ai/code にも色が同期される。-p モードでも利用可能"
    argument-hint: "[color|default]"
  - name: compact
    description: これまでの会話を要約してコンテキストを解放する。要約の焦点を絞る指示を任意で渡せる
    argument-hint: "[instructions]"
  - name: config
    description: "設定インターフェースを開いてテーマ、モデル、出力スタイルなどを調整する。key=value のペア（例: /config thinking=false）を渡すと設定を直接変更でき、/config theme=dark や /config model=sonnet のような短縮キーも使える。`/config --help` で設定可能な全キーと選択肢を表示する。インタラクティブ・-p・Remote Controlの各モードで動作。エイリアス: /settings"
    argument-hint: "[key=value...]"
  - name: context
    description: 現在のコンテキスト使用量をカラーグリッドで表示する。コンテキスト負荷の高いツール、メモリ膨張、容量警告の最適化提案も表示。会話がコンテキストウィンドウを超えた場合は、超過量と空き容量を確保するコマンドを警告として表示する。`all` を渡すと項目ごとの詳細をフルスクリーンで展開
    argument-hint: "[all]"
  - name: copy
    description: "最後のアシスタントレスポンスをクリップボードにコピーする。数値Nを渡すとN番目に新しいレスポンスをコピー（例: /copy 2）。コードブロックがある場合は個別ブロックまたは全体を選択するピッカーを表示。ピッカーで `w` を押すとクリップボードの代わりにファイルに書き込む（SSH経由で便利）"
    argument-hint: "[N]"
  - name: daemon
    description: バックグラウンドサービスと routines を管理する
  - name: design-consent
    description: Claude エージェントに Design プロジェクトへのアクセスを許可する
  - name: design-login
    description: /design-sync 用のデザインシステムアクセスを claude.ai アカウントで認可する
  - name: design-revoke
    description: Claude エージェントの Design プロジェクトへのアクセスを取り消す
  - name: desktop
    description: "現在のCLIセッションをClaude Code Desktopアプリに引き継ぐ。macOSまたはx64のWindowsとClaudeのサブスクリプションが必要。エイリアス: /app"
  - name: diff
    description: コミットされていない変更とターンごとのdiffを対話的に表示する。左右矢印キーでgit diffとClaudeの各ターンを切り替え、上下キーでファイルを閲覧。Enterで選択したファイルのdiffを開き、Escでファイル一覧に戻る。diffはgitのblobから直接計算されるため、diff driverやtextconvフィルターは適用されない。ビューアを開いたままセッション外でgitの状態が変わると自動的に再読み込みされる
  - name: effort
    description: "モデルの推論レベルを設定する。low/medium/high/xhigh/max/ultracodeを指定可能。利用可能なレベルはモデル依存。maxとultracodeは現在のセッションのみ。ultracodeはxhighの推論と自動ワークフローオーケストレーションを組み合わせる。autoでモデルのデフォルトにリセット。引数なしで対話的スライダーを開く。現在の応答の完了を待たずに即座に反映される。-p モードでもレベル引数付きで利用でき、その場合は現在のセッションにのみ適用される。モデルデフォルトの effort ホールドが効いている間は Not applied となるため、起動時に --effort を渡す"
    argument-hint: "[level|auto]"
  - name: exit
    description: "CLIを終了する。バックグラウンドセッションにアタッチ中の場合はデタッチするだけで、セッションは動き続ける。エイリアス: /quit"
  - name: export
    description: "現在の会話をプレーンテキストとしてエクスポートする。ファイル名を指定するとそのファイルに直接書き込み、指定なしの場合はクリップボードへのコピーまたはファイル保存のダイアログを開く"
    argument-hint: "[filename]"
  - name: fast
    description: "Fastモードのオン/オフを切り替える。-p モードでは、--settings で Fast モードを有効にして起動したセッション（例: claude -p --settings '{\"fastMode\": true}'）でのみ機能し、切り替えはそのセッション限りでデフォルトには保存されない。それ以外の非対話セッションでは Fast モードが利用できない旨が表示される"
    argument-hint: "[on|off]"
  - name: feedback
    description: Claude Code に関するプロダクトフィードバックを送る。/bug と同じダイアログが開き、同意手順と送信ルールも同じ
    argument-hint: "[report]"
  - name: focus
    description: フォーカスビューをトグルする。直前のプロンプト、ツール呼び出しのサマリー（編集diffstat付き）、最終レスポンスのみを表示。サマリーにはそのターンで起動したサブエージェント数も含まれ、完了したバックグラウンドタスクの通知は件数1行にまとめられる。選択状態はセッション間で保持され、viewMode 設定で上書きできる。fullscreenレンダリング時のみ利用可能。VS Code 拡張はコマンドメニューのトグルとして独自の Focus ビューを持ち、拡張機能の設定として保存され viewMode とは独立している
  - name: fork
    description: "現在の会話を新しいバックグラウンドセッションにコピーし、この場で作業を続ける。2つのセッションはその時点から独立する。プロンプトを渡すとコピー側がすぐに作業を開始し、渡さない場合は agent view で待機する。コピー側がその場で編集する場合を除き、Claude Code はコード変更の前に専用の worktree を作るよう指示する（この隔離指示は v2.1.221 以降）。結果がこの会話に返るサブエージェントに副タスクを任せるには /subtask を、自分でコピーに切り替えるには /branch を使う。v2.1.212 以降が必要で、それ以前のバージョンや agent view を無効にしている場合はフォーク済みサブエージェントの起動になる"
    argument-hint: "[prompt]"
  - name: goal
    description: "ゴールを設定する。Claudeは条件が満たされるか、達成不可能と判断されるまで複数ターンにわたって作業を続ける。引数なしで現在のゴール、または直近に達成したゴールを表示。clear・stop・off・reset・none・cancel のいずれかを渡すと、有効なゴールを早期に解除できる。インタラクティブ・-p・Remote Controlの各モードで動作"
    argument-hint: "[condition|clear]"
  - name: heapdump
    description: メモリ使用量診断用にJavaScriptヒープスナップショットとメモリブレークダウンを ~/Desktop（Desktop フォルダが無い Linux ではホームディレクトリ）に出力する。メモリ問題を報告する際は -diagnostics.json のみを添付する。.heapsnapshot ファイルには会話全体と認証情報が含まれるため共有しないこと。コマンドメニューには表示されないため、コマンド名を最後まで入力する必要がある
  - name: help
    description: ヘルプと利用可能なコマンド一覧を表示する
  - name: hooks
    description: ツールイベント用のフック設定を表示する
  - name: ide
    description: IDE連携の管理とステータス表示
  - name: import
    description: "自分のマシンにある他のコーディングエージェント（現時点では OpenAI Codex と Google Gemini CLI）の設定を Claude Code に取り込む。指示ファイル・MCPサーバー・コマンド・サブエージェント・スキルが対象。--dry-run で何も書き込まずに内容を確認でき、--yes で対話的な選択画面をスキップできる。-p モードでは検出した内容を一覧表示し、インポートを確定するコマンドを提示する。Amazon Bedrock・Google Cloud の Agent Platform・Microsoft Foundry・Claude Platform on AWS、および feature-flag の取得を無効にしている場合は利用できない。v2.1.213 以降が必要"
    argument-hint: "[codex|gemini] [--dry-run] [--yes]"
  - name: init
    description: "CLAUDE.mdガイドでプロジェクトを初期化する。CLAUDE_CODE_NEW_INIT=1で、スキル・フック・個人メモリファイルの設定も含むインタラクティブフローを使用可能。/import が対応するコーディングエージェントの設定が見つかった場合は、その引き継ぎを提案する"
  - name: insights
    description: このマシン上の直近のセッションを分析したHTMLレポートを生成する（プロジェクト領域、インタラクションパターン、摩擦ポイント、試すとよい機能）。クラウドセッションでは利用できない
  - name: install-github-app
    description: リポジトリに Claude GitHub App をインストールする。任意で GitHub Actions ワークフローとシークレットのセットアップも行う。リポジトリの選択から連携設定まで対話的にガイドされる
  - name: install-slack-app
    description: Claude Slackアプリをインストールする。ブラウザを開いてOAuthフローを完了する
  - name: keybindings
    description: キーボードショートカットの設定ファイルを開く
  - name: list-agents
    description: "Claude がメッセージを送れるサブエージェントと他の Claude Code セッションを、指定に使う名前とあわせて一覧表示する。agent team のメンバーはチームのロスター経由で到達するため一覧には含まれない。クロスセッションメッセージングが有効なセッションでのみ利用でき、v2.1.224 以降が必要。エイリアス: /peers"
  - name: login
    description: Anthropicアカウントにサインインする
  - name: logout
    description: Anthropicアカウントからサインアウトする
  - name: loops
    description: loop の一覧表示・作成・削除を行う
  - name: mcp
    description: "MCPサーバー接続とOAuth認証を管理する。引数なしで対話的な一覧を開き、`reconnect <server>` で切断された1つのサーバーを再接続、`enable`/`disable` にサーバー名または `all` を渡して有効化/無効化する。-p モードで引数なしに実行すると、一覧を開く代わりにサーバー状態のテキストサマリーを表示する"
    argument-hint: "[reconnect <server>|enable|disable [<server>|all]]"
  - name: memory
    description: CLAUDE.mdメモリファイルの編集、自動メモリの有効化/無効化、自動メモリエントリの表示を行う
  - name: mobile
    description: "Claudeモバイルアプリのダウンロード用QRコードを表示する。エイリアス: /ios, /android"
  - name: model
    description: AIモデルを切り替え、新規セッションのデフォルトとして保存する。対応モデルでは左右矢印キーで推論レベルを調整可能。引数なしでピッカーを開き、`s`キーで現在のセッションのみ切り替え。すでに出力のある会話では、次の応答がキャッシュなしで全履歴を読み直すことになるため、ピッカーが確認を求める。確定後は現在の応答の完了を待たずに適用される
    argument-hint: "[model]"
  - name: passes
    description: 友人にClaude Codeの無料1週間パスを共有する。対象アカウントのみ表示
  - name: pause-memory
    description: "このセッションの自動メモリ保存を一時停止する。エイリアス: /memory-pause, /toggle-memory"
  - name: permissions
    description: "ツールパーミッションのallow・ask・denyルールを管理する。対話ダイアログを開き、スコープ別のルール確認、ルールの追加・削除、作業ディレクトリの管理、autoモードでの直近の拒否内容の確認ができる。エイリアス: /allowed-tools"
  - name: plan
    description: "プロンプトからプランモードに直接入る。説明を渡すとそのタスクですぐにプランモードを開始する（例: /plan 認証バグを修正）"
    argument-hint: "[description]"
  - name: plugin
    description: "Claude Codeプラグインを管理する。引数なしでプラグインメニューを開くか、list・install・enable・disable などのサブコマンドを渡して直接操作する。Claude Code はインストール中にプラグインを有効化できる場合があり、有効化されたか /reload-plugins が必要かはインストール結果のサマリーに表示される"
    argument-hint: "[subcommand]"
  - name: powerup
    description: インタラクティブなレッスンとアニメーションデモでClaude Codeの機能を発見する
  - name: privacy-settings
    description: プライバシー設定を表示・更新する。ProおよびMaxプランのサブスクライバーのみ利用可能
  - name: radio
    description: Claude FMのlo-fiラジオをブラウザで開く。ブラウザが使えない場合はストリームURLを表示する。Amazon Bedrock・Google Cloud's Agent Platform・Microsoft Foundry・Claude Platform on AWSでは利用不可
  - name: recap
    description: 現在のセッションの1行サマリーをオンデマンドで生成する。しばらく離席した後に自動表示されるセッションリキャップとは別に、任意のタイミングで実行できる
  - name: release-notes
    description: インタラクティブなバージョンピッカーで変更履歴を表示する。特定のバージョンを選んでリリースノートを見るか、全バージョンをまとめて表示できる。表示内容はトランスクリプトに出るだけで、Claude が読む会話には入らない
  - name: reload-plugins
    description: "アクティブなプラグインをすべてリロードし、保留中の変更を再起動なしで適用する。リロードされたコンポーネント数とロードエラーを報告。読み込まれるMCPツールが変化してプロンプトキャッシュが無効化される場合は警告してスキップし、--force を渡すと強制実行する"
    argument-hint: "[--force]"
  - name: reload-skills
    description: 再起動せずにスキルとコマンドのディレクトリを再スキャンし、ディスク上の変更を反映する。利用可能なスキル数と追加・削除された数を報告する
  - name: remote-control
    description: "このセッションをclaude.aiからのRemote Controlに利用可能にする。サインアウト状態で実行すると、Remote Controlにはclaude.aiのサブスクリプションが必要である旨とサインイン方法が表示される。エイリアス: /rc"
  - name: remote-env
    description: クラウドエージェント用のデフォルト環境を選択する
  - name: rename
    description: 現在のセッションの名前を変更し、プロンプトバーに表示する。名前未指定時は会話履歴から自動生成。claude.ai やデスクトップアプリを含むどのリネーム経路でも、制御文字・不可視文字はスペースに置換され、名前は200文字で打ち切られる。不可視文字を除くと空になる名前は拒否される。同じマシン上の別の実行中セッションが既に使っている名前を渡した場合は、その変種が代わりに適用される。この正規化と文字数上限は v2.1.221 以降
    argument-hint: "[name]"
  - name: resume
    description: "IDまたは名前で会話を再開するか、セッションピッカーを開く。バックグラウンドセッションは bg 付きで表示され、実行中のものはここでは再開できないため claude agents からアタッチするか停止する。エイリアス: /continue"
    argument-hint: "[session]"
  - name: review
    description: "v2.1.223 以降は /code-review のエイリアスで、現在の差分、または渡した PR 番号・ブランチ・パス（例: /review 1234）をレビューする。effort レベルとフラグも /code-review と同じものが使える。クラウド上の詳細レビューは /code-review ultra を使う。以前のバージョンでは GitHub Pull Request を番号で指定した高速なシングルパスの読み取り専用レビューだった"
    argument-hint: "[low|medium|high|xhigh|max|ultra] [--fix] [--comment] [pr#|branch|path]"
  - name: rewind
    description: "会話やコードを以前のポイントに巻き戻す、または選択したメッセージから要約する。チェックポイント機能参照。エイリアス: /checkpoint, /undo"
  - name: sandbox
    description: サンドボックスモードを切り替える。対応プラットフォームのみ
  - name: schedule
    description: "routines（Cloudスケジュールタスク）の作成・更新・一覧・実行を行う。Claudeが対話的にセットアップをガイドし、routine の直近の実行状況について尋ねることもできる。エイリアス: /routines"
    argument-hint: "[description]"
  - name: scroll-speed
    description: マウスホイールのスクロール速度を対話的に調整する。ダイアログ表示中にスクロール可能なルーラーで変更をプレビューできる。全画面レンダリング時のみ利用でき、JetBrains IDE のターミナルでは使えない
  - name: security-review
    description: 現在のブランチの変更をセキュリティ脆弱性の観点から分析する。ブランチと origin のデフォルトブランチとの差分をレビューし、インジェクション、認証の問題、データ漏洩などのリスクを特定する。origin リモートが必要
  - name: session
    description: "クラウドセッションの URL と QR コードを表示する。エイリアス: /remote"
  - name: setup-bedrock
    description: Amazon Bedrock認証・リージョン・モデルピンをインタラクティブウィザードで設定する。CLAUDE_CODE_USE_BEDROCK=1の場合のみ表示。初回利用時はログイン画面からもこのウィザードを開ける
  - name: setup-vertex
    description: Google Cloud's Agent Platform認証・プロジェクト・リージョン・モデルピンをインタラクティブウィザードで設定する。CLAUDE_CODE_USE_VERTEX=1の場合のみ表示。初回利用時はログイン画面からもこのウィザードを開ける
  - name: skill-doctor
    description: 読み込まれているスキルのうち、使われずにコンテキストを消費しているものを表示する
  - name: skills
    description: 利用可能なスキルを一覧表示する。入力して名前で絞り込み、`t`キーでトークン数でソート、`Space`キーでClaudeと / メニューへの表示/非表示を切り替え、`Enter`で保存
  - name: status
    description: "設定インターフェースを開く（Statusタブ）。バージョン、モデル、アカウント、接続状況を表示。v2.1.221以降はセッション種別（インタラクティブか、attached / unattended のバックグラウンドジョブか）も表示する。Claudeのレスポンス中でも動作"
  - name: statusline
    description: "Claude Codeのステータスラインを設定する。表示内容を指定するか、引数なしでシェルプロンプトから自動設定"
  - name: stickers
    description: Claude Codeステッカーを注文する
  - name: stop
    description: 現在のバックグラウンドセッションを停止する。バックグラウンドセッションにアタッチ中のみ利用可能。トランスクリプトとworktreeは保持される。停止せずにデタッチしたい場合は /exit か左矢印キーを使う
  - name: subtask
    description: "フォーク済みサブエージェントを起動する。会話全体を引き継いだバックグラウンドサブエージェントがタスクを実行し、その間も作業を続けられる。完了するとこの会話に結果が返る。会話を別のバックグラウンドセッションにコピーする場合は /fork を使う。v2.1.212 以降が必要で、agent view を無効にしている場合は利用できず、その環境では /fork がフォーク済みサブエージェントの起動を担う"
    argument-hint: "<task>"
  - name: tasks
    description: "現在のセッションのバックグラウンド処理を一覧・管理する。完了済みのサブエージェントも含まれる。エイリアス: /bashes"
  - name: team-onboarding
    description: 直近30日のセッション・コマンド・MCPサーバー利用状況から、チームメイトが最初のメッセージとして貼り付けられるMarkdown形式のオンボーディングガイドを生成する。Pro/Max/Team/EnterpriseプランのClaude.aiサブスクライバーは、チームメイトがClaude Codeで直接開ける共有リンクも取得できる
  - name: teleport
    description: "Claude Code Webセッションをこのターミナルに引き込む。ピッカーを開いてブランチと会話を取得。claude.aiサブスクリプションが必要。エイリアス: /tp"
  - name: terminal-setup
    description: ターミナルのキーバインドを設定する（Shift+Enterなどのショートカット）。VS Code・Cursor・Devin Desktop・Alacritty・Zedなど必要なターミナルでのみ表示
  - name: theme
    description: "カラーテーマを変更する。ターミナルのダーク/ライトモードに追従するauto、ライト/ダーク、色覚対応（ダルトナイズ）テーマ、ターミナルのパレットを使うANSIテーマ、~/.claude/themes/ やプラグイン由来のカスタムテーマを含む。`New custom theme…` を選ぶと新しいテーマを作成できる"
  - name: tui
    description: "ターミナルUIレンダラーを設定し、会話を保ったまま再起動する。fullscreenでフリッカーフリーのalt-screenレンダラーを有効化。引数なしで現在のレンダラーを表示"
    argument-hint: "[default|fullscreen]"
  - name: ultrareview
    description: "クラウドサンドボックス上でマルチエージェント・コードレビューを深く実行する。PR参照を渡すとそのプルリクエストを、ブランチ名を渡すと比較ベースを変更してレビューする。推奨される呼び出しは /code-review ultra となり、/ultrareview はエイリアスとして残る。Pro/Maxプランでは3回まで無料、以降は usage credits が必要"
    argument-hint: "[PR|branch]"
  - name: update
    description: "会話を維持したまま最新バージョンに切り替える。エイリアス: /restart"
  - name: upgrade
    description: より高いプランティアに切り替えるためのアップグレードページをブラウザで開く。ブラウザを開けなかった場合は URL を表示せずサインインプロンプトを表示する
  - name: usage
    description: "セッションコスト、プラン使用制限、アクティビティ統計を表示する。Pro・Max・Team・Enterpriseの各プランでは、スキル・サブエージェント・プラグイン・MCPサーバー別の使用量内訳も表示する。エイリアス: /cost, /stats"
  - name: usage-credits
    description: "レート制限に達した際に使用量クレジットを設定する、または管理者にリクエストする。ブラウザで使用量クレジットの請求設定を開くが、請求権限を持たない Team・Enterprise メンバーはダイアログで確認したうえで CLI から管理者へリクエストを送信する。SSH 経由などブラウザを開けない場合は URL を表示する。/extra-usage からリネームされた"
  - name: version
    description: このセッションが実行中のバージョンを表示する。autoupdate がダウンロード済みのバージョンとは異なる場合がある
  - name: voice
    description: 音声入力を切り替える、または特定のモードで有効化する。Claude.aiアカウントが必要
    argument-hint: "[hold|tap|off]"
  - name: web-setup
    description: ローカルのgh CLI認証情報を使用してClaude Code WebにGitHubアカウントを接続する。GitHub未接続の場合は /schedule が自動的に接続を促す
  - name: workflows
    description: ワークフロー進捗ビューを開き、実行中および完了したワークフローの監視・一時停止・再開・保存を行う
skills:
  - name: artifact-capabilities
    description: 公開した Artifact ページに付与できるランタイム機能 — ライブデータや接続済みデータの読み取り、閲覧者間での状態共有、ページ自身の更新と再公開など、静的 HTML だけでは実現できない挙動。利用可能な機能一覧と型付きの呼び出し定義を提供する
  - name: artifact-components
    description: 再利用可能なコンポーネントを Artifact に埋め込む
  - name: artifact-design
    description: Artifacts のデザインガイダンスと基礎知識
  - name: artifact-diagramming
    description: Artifacts の図表作成ガイダンス
  - name: artifact-pr-review
    description: テンプレートから PR レビュー用のブリーフィング Artifact を公開する
  - name: batch
    description: "大規模な変更を調査・計画し、5〜30の独立したワークツリーエージェントで並列実行して、それぞれがテストを実行しPRを作成する。gitリポジトリが必要"
    argument-hint: "<instruction>"
  - name: claude-api
    description: "Claude APIとManaged Agentsのリファレンス資料をプロジェクトの言語（Python, TypeScript, Java, Go, Ruby, C#, PHP, cURL）に応じて読み込む。tool use、streaming、batches、structured outputs、よくある落とし穴をカバー。サブコマンド: `migrate` は既存のClaude APIコードを新しいモデル向けに更新、`managed-agents-onboard` はManaged Agentの作成を対話的にガイド、`prompt-audit`（v2.1.221以降）はプロンプトとtool descriptionを古いモデル向けの記述がないか監査する。`anthropic` または `@anthropic-ai/sdk` をインポートすると自動的に有効化"
    argument-hint: "[migrate|managed-agents-onboard|prompt-audit]"
  - name: claude-code-docs
    description: Claude Code の機能や設定に関する質問に回答する
  - name: claude-in-chrome
    description: Chrome ブラウザを自動操作して Web ページを操作する。要素のクリック、フォーム入力、スクリーンショット取得、コンソールログの読み取り、ページ遷移に対応。既存の Chrome セッション内の新しいタブでページを開くため、拡張機能側でサイトごとの権限設定が必要
  - name: code-review
    description: "現在の diff、または渡した PR 番号・ブランチ・パスを指定した effort レベルで、正しさのバグと再利用・簡素化・効率化のクリーンアップの観点からレビューする。effort が低いほど高確度の少数の指摘に絞り、high〜max では網羅範囲を広げ、`ultra` はクラウド上で深いマルチエージェントレビューを実行する。effort レベル未指定時は前回入力したレベルを再利用し、一度も入力していない場合はセッションの effort レベルにフォールバックする。バックグラウンドサブエージェントとして実行されるため、レビュー処理で会話が埋まらない。`--fix` で修正を working tree に適用、`--comment` で GitHub PR にインラインコメントとして投稿する。github.com の PR を対象に `ultra` を使う場合、`--post` を渡すと起動ダイアログで「完了したレビュー結果を PR に投稿する」が事前選択される。エイリアス: /review"
    argument-hint: "[low|medium|high|xhigh|max|ultra] [--fix] [--comment] [pr#|branch|path]"
  - name: code-walkthrough
    description: コードのインタラクティブなウォークスルー Artifact を生成する
  - name: commit
    description: "git コミットを作成する。ユーザーからの依頼か作業手順の一部かを問わず、コミットを作ろうとしているときは常にこれを使う。git のコンテキストを収集し、規定のコミットワークフロー（メッセージのスタイル、ステージングのルール、attribution）を適用する"
  - name: dataviz
    description: "チャート・グラフ・ダッシュボードの設計を支援する。データに合ったチャート形式を選び、役割に応じて色を割り当て、付属スクリプトで色覚多様性への安全性とコントラストを検証し、マーク・インタラクション・アクセシビリティのルールを適用する。ブランドニュートラルなプレースホルダーパレットを使うので、自分のブランドカラーに差し替えて使う"
    argument-hint: "[request]"
  - name: debug
    description: 現在のセッションのデバッグログを有効にし、セッションのデバッグログを読んで問題をトラブルシュートする。`claude --debug` で起動していない限りログ出力は無効なため、セッション途中で /debug を実行するとその時点以降のログが記録される。説明を付けて分析の焦点を絞ることも可能
    argument-hint: "[description]"
  - name: deep-research
    description: "Web 検索をファンアウトし、ソースを取得・相互検証してから、引用付きのリサーチレポートを統合する"
    argument-hint: "<question>"
  - name: design
    description: "Claude Design (claude.ai/design) を操作する: 作成・インポート・エクスポート・同期と、エージェントのアクセス管理"
    argument-hint: "[consent|revoke]"
  - name: design-sync
    description: "リポジトリのReactデザインシステムを変換してClaude Designにアップロードし、デザインで実際のコンポーネントを使えるようにする。デザインシステム名を任意で指定可能。大規模リポジトリでは初回同期に数時間かかることがある。Amazon Bedrock・Google Cloud Agent Platform・Microsoft Foundry・Claude Platform on AWSでは利用不可"
    argument-hint: "[hint]"
  - name: doctor
    description: "セットアップ全体を点検し、見つかった問題を診断して修正まで行う。インストール状態（重複や残存インストールを含む）・PATHの問題・解析できない設定ファイルを確認し、コンテキストコストに見合わない未使用のスキル・MCPサーバー・プラグインを洗い出し、遅いフックを検出し、リリースチャンネル上の新バージョンの有無も確認する。ローカルのCLAUDE.mdをコミット済みのものと突き合わせて重複を整理し、コードベースから読み取れる内容を削り、残った常時ロードのガイダンスをスキルや必要時にロードされるネストしたCLAUDE.mdへ移す。さらに auto モードをデフォルトにすることや、頻繁に拒否している読み取り専用コマンドの事前承認も提案する。変更前に必ず結果を提示して確認を求める。エイリアス: /checkup"
  - name: fewer-permission-prompts
    description: トランスクリプトから頻出するread-onlyのBashとMCPツール呼び出しをスキャンし、プロジェクトの `.claude/settings.json` に優先度付きのallowlistを追加してパーミッションプロンプトを削減する
  - name: loop
    description: "セッションが開いている間、プロンプトやスラッシュコマンドを繰り返し実行する。間隔を省略すると Claude がイテレーション間隔をセルフペーシングする。プロンプトを省略すると自律メンテナンスチェック（または .claude/loop.md のプロンプト）を実行する。エイリアス: /proactive"
    argument-hint: "[interval] [prompt]"
  - name: plan-artifact
    description: 実装計画・設計ドキュメント・RFC を共有可能な Artifact として公開する
  - name: pr-explainer
    description: PR の共有可能なウォークスルー Artifact を生成する。何がどう変わり、なぜそうしたかを、レビュアー向けのビフォー/アフター形式でまとめる
  - name: prototype
    description: アイデアを動作する Artifact としてプロトタイプ化する
  - name: run
    description: "プロジェクトのアプリを起動・操作して、変更が動作している様子を実際に確認する。既存のプロジェクト用スキルがあればそれを優先し、なければプロジェクトタイプごとの組み込みパターンにフォールバックする"
  - name: run-skill-generator
    description: "/run と /verify に対し、クリーンな環境からプロジェクトのアプリをビルド・起動・操作する方法を教え込む"
  - name: simplify
    description: "変更されたコードのクリーンアップ箇所をレビューし、修正を適用する。4つのレビューエージェントが並列で動き、既存ヘルパーの再利用・簡素化・効率化・抽象度の妥当性をカバーする。正しさのバグは探さない（バグ検出は /code-review を使用）。パスや PR 参照を渡すと対象を絞ってレビューできる"
    argument-hint: "[target]"
  - name: update-config
    description: settings.json の設定を変更する。hooks、permissions、環境変数に対応
  - name: verify
    description: "テストや型チェックに頼るのではなく、プロジェクトのアプリをビルドして実行し、実際の挙動を観察することで、コード変更が意図通り動作するかを確認する"
  - name: whiteboard
    description: Claude に送り返せるホワイトボード Artifact 上でスケッチする
  - name: workshop
    description: Artifact 上で提示される選択を通じてドキュメントを検討・作り込む
agents:
  - name: Explore
    description: コードベースの検索と分析に最適化された高速な読み取り専用エージェント
  - name: Plan
    description: プランモード中にコンテキストを収集してからプランを提示するリサーチエージェント
  - name: general-purpose
    description: 探索とアクションの両方を必要とする複雑なマルチステップタスク向けの汎用エージェント
  - name: statusline-setup
    description: /statuslineでステータスラインを設定する際に使用
  - name: claude-code-guide
    description: Claude Codeの機能について質問する際に使用
  - name: claude
    description: "サブエージェントが使える全ツールを持つ万能エージェント。より専門的なエージェントが当てはまらないタスクで使用。起動したバックグラウンドセッションのデフォルトエージェントでもあり、開始時のパーミッションモードはセッションの起動方法によって決まる"
