name: claude
description: Claude Code built-in commands,skills,agents
color: amber  # You can also use hex codes like "#FF6B35"
references:
  - https://code.claude.com/docs/en/commands
  - https://code.claude.com/docs/en/skills#bundled-skills
  - https://code.claude.com/docs/en/sub-agents#built-in-subagents

commands:
  - name: add-dir
    description: Add a working directory for file access during the current session. Typing a partial path shows matching directory suggestions; press Tab to accept one. Most .claude/ configuration is not discovered from the added directory. A successful add runs your DirectoryAdded hooks. Can also be run while Claude is responding; you confirm the directory right away and Claude's next tool call in the same turn can access it, which requires v2.1.234 or later
    argument-hint: "<path>"
  - name: advisor
    description: "Enable or disable the advisor tool, which consults a second model for guidance at key moments during a task. Accepts fable, opus, sonnet, or a full model ID; fable requires Fable 5 access. Without an argument, opens a picker"
    argument-hint: "[model|off]"
  - name: agents
    description: "Prints a reminder to ask Claude to create or manage subagents, or to edit the .claude/agents/ or ~/.claude/agents/ files directly. Earlier versions opened an interactive management interface"
  - name: artifacts
    description: "List the artifacts you own or that are shared with you, then attach one to the session, open it in your browser, or copy its link. Available wherever artifacts are available. Requires v2.1.208 or later; attaching with Enter requires v2.1.216"
  - name: auto-mode-setup
    description: "Draft `autoMode.environment` entries from your project and recent sessions, then review the draft and save it to your user settings. Requires a Pro, Max, or Team plan and v2.1.228 or later; on native Windows, requires v2.1.233 or later"
  - name: autocompact
    description: "Set the auto-compact window: how full the context window gets before Claude Code compacts automatically. Pass a size such as 500k, or `auto` to return to the window tuned for your model. The value is saved to user settings and applied to the current session. Without an argument, opens a dialog showing the current window. Requires v2.1.221 or later"
    argument-hint: "[auto|<tokens>]"
  - name: autofix-pr
    description: Spawn a Claude Code on the web session that watches the current branch's PR and pushes fixes when CI fails or reviewers leave comments. Detects the open PR from the checked-out branch, so check out another branch first to watch its PR. By default the cloud session fixes every CI failure and review comment; pass a prompt to give it different instructions. Requires the gh CLI and access to Claude Code on the web
    argument-hint: "[prompt]"
  - name: background
    description: "Detach the current session to run as a background agent and free this terminal. Pass a prompt to send one more instruction before detaching. Monitor the session with `claude agents`. To copy the conversation into a new background session while this one keeps running, use /fork. Alias: /bg"
    argument-hint: "[prompt]"
  - name: branch
    description: Create a branch of the current conversation at this point to try a different direction without losing the conversation as it stands. Switches you into the branch and preserves the original, which you can return to with /resume. To run a copy as a separate background session instead of switching into it, use /fork; to hand a side task to a subagent that reports back into this conversation, use /subtask
    argument-hint: "[name]"
  - name: brief
    description: "Toggle brief-only mode, where Claude replies through a dedicated message tool instead of normal assistant text"
  - name: btw
    description: Ask a quick side question without adding to the conversation. Without a question, reopens the overlay on your most recent side question from this session so you can browse earlier answers; with no side questions yet, it prints a usage line
    argument-hint: "[question]"
  - name: bug
    description: "Report a bug or share your conversation. You choose how much session history to include and confirm on a consent screen before anything is sent. When signed in to Anthropic on a first-party connection the report goes to Anthropic; on a third-party provider or without Anthropic credentials it is written to a local archive under ~/.claude/feedback-bundles/ that you forward yourself. In the VS Code extension it opens the extension's own feedback dialog instead, which requires v2.1.229 or later. When run while Claude is responding, the dialog opens immediately instead of being queued until the turn finishes, which requires v2.1.232 or later. Alias: /share"
    argument-hint: "[report]"
  - name: cd
    description: "Move this session to a new working directory. The conversation's prompt cache is preserved and the new directory's CLAUDE.md is appended instead of rebuilding the system prompt. The session is relocated to the new directory's project storage, so --resume and --continue find it from there; as of v2.1.223 claude --resume <session-id> also finds the moved session from any other directory. Prompts you to trust the directory if you have not worked in it before, and Cd permission rules can restrict or disable targets. Typing a partial path shows matching directory suggestions; press Tab to accept one. To grant access to an extra directory without moving the session, use /add-dir"
    argument-hint: "<path>"
  - name: chrome
    description: Configure Claude in Chrome settings
  - name: clear
    description: "Start a new conversation with empty context. Pass a name to label the previous conversation in the /resume picker. To free up context while continuing the same conversation, use /compact instead. Resume the previous conversation with /resume, or, within the same Claude Code process, restore it from the rewind menu's previous-session entry. Aliases: /reset, /new"
    argument-hint: "[name]"
  - name: color
    description: "Set the prompt bar color for the current session. Available colors: red, blue, green, yellow, purple, orange, pink, cyan. Use `default` to reset, or run with no argument to pick a random color. When Remote Control is connected the color syncs to claude.ai/code. Also available in -p mode"
    argument-hint: "[color|default]"
  - name: compact
    description: Free up context by summarizing the conversation so far. Optionally pass focus instructions for the summary
    argument-hint: "[instructions]"
  - name: config
    description: "Open the Settings interface to adjust theme, model, output style, and other preferences. Pass key=value pairs (e.g. /config thinking=false) to set settings directly; named shorthand keys such as /config theme=dark or /config model=sonnet are also accepted. Run `/config --help` to list every settable key with its options. Works in interactive, -p, and Remote Control modes. Alias: /settings"
    argument-hint: "[key=value ...]"
  - name: context
    description: Visualize current context usage as a colored grid. Shows optimization suggestions for context-heavy tools, memory bloat, and capacity warnings. When the conversation exceeds the context window, the output warns how far over the limit you are and which command frees space. Pass `all` to expand the per-item breakdown in fullscreen mode
    argument-hint: "[all]"
  - name: copy
    description: "Copy the last assistant response to clipboard. Pass a number N to copy the Nth-latest response (e.g. /copy 2). When code blocks are present, shows an interactive picker to select individual blocks or the full response. Press `w` in the picker to write the selection to a file instead of the clipboard, which is useful over SSH"
    argument-hint: "[N]"
  - name: daemon
    description: Manage background services and routines
  - name: design-consent
    description: Grant Claude agent access to your Design projects
  - name: design-login
    description: Authorize design-system access for /design-sync with your claude.ai account
  - name: design-revoke
    description: Revoke Claude agent access to your Design projects
  - name: desktop
    description: "Continue the current session in the Claude Code Desktop app. Requires macOS or x64 Windows and a Claude subscription. Alias: /app"
  - name: diff
    description: Open an interactive diff viewer showing uncommitted changes and per-turn diffs. Use left/right arrows to switch between the current git diff and individual Claude turns, and up/down to browse files. Press Enter to open the selected file's diff and Esc to return to the file list. Diffs come from raw git blob content, so diff drivers and textconv filters do not apply. The open viewer refreshes automatically when the repository's git state changes outside the session
  - name: effort
    description: "Set the model effort level. Accepts low/medium/high/xhigh/max/ultracode. Available levels depend on the model; max and ultracode are session-only. ultracode combines xhigh reasoning with automatic workflow orchestration. auto resets to the model default. Pass status to print the current level. Without an argument, opens an interactive slider. Takes effect immediately without waiting for the current response to finish. Also available in -p mode with a level argument, where it applies to the current session only; while the model-default effort hold is in force it reports Not applied, so pass --effort at launch instead"
    argument-hint: "[level|auto|status]"
  - name: exit
    description: "Exit the CLI. In an attached background session, this detaches and the session keeps running. Alias: /quit"
  - name: export
    description: "Export the current conversation as plain text. With a filename, writes directly to that file; without, opens a dialog to copy to clipboard or save to a file"
    argument-hint: "[filename]"
  - name: fast
    description: "Toggle Fast mode on or off. In -p mode it works only in a session launched with fast mode in its --settings value, for example claude -p --settings '{\"fastMode\": true}'; the toggle then applies to that session only and is not saved as your default, and any other non-interactive session reports that fast mode is not available"
    argument-hint: "[on|off]"
  - name: feedback
    description: Send product feedback about Claude Code. Opens the same dialog as /bug, with the same consent step and sending rules
    argument-hint: "[report]"
  - name: focus
    description: Toggle the focus view that shows only your last prompt, a one-line tool-call summary with edit diffstats, and the final response. The summary also counts the subagents launched in the turn and collapses completed background-task notifications into a single count. The selection persists across sessions and can be overridden with the viewMode setting. Only available in fullscreen rendering. The VS Code extension offers its own Focus view as a command-menu toggle, stored as an extension setting and independent of viewMode
  - name: fork
    description: "Copy the current conversation into a new background session and keep working here; the two sessions are independent from that point on. Pass a prompt and the copy starts on it immediately; without one it waits in agent view. Except when the copy edits in place, Claude Code instructs it to create a worktree of its own before making code changes; the isolation instruction requires v2.1.221 or later. To hand a side task to a subagent whose result returns to this conversation, use /subtask; to switch into a copy yourself, use /branch. Requires v2.1.212 or later; on earlier versions, and whenever agent view is turned off, /fork starts a forked subagent instead"
    argument-hint: "[prompt]"
  - name: goal
    description: "Set a goal: Claude keeps working across turns until the condition is met or the goal clears for another reason, such as a turn dying on an unrecoverable error. When background tasks keep a goal waiting for 30 minutes or more, Claude checks in on them instead of waiting indefinitely. With no argument, shows the current or most recently achieved goal. Pass clear, stop, off, reset, none, or cancel to remove an active goal early. Works in interactive, -p, and Remote Control modes"
    argument-hint: "[condition|clear]"
  - name: heapdump
    description: Write a JavaScript heap snapshot and a memory breakdown to ~/Desktop, or your home directory on Linux without a Desktop folder, for diagnosing high memory usage. Attach only the -diagnostics.json file when reporting a memory issue; the .heapsnapshot file contains your full conversation and credentials, so do not share it. Does not appear in the command menu, so type it in full
  - name: help
    description: Show help and available commands
  - name: hooks
    description: View hook configurations for tool events
  - name: ide
    description: Manage IDE integrations and show status
  - name: import
    description: "Bring configuration from other coding agents on your machine, currently OpenAI Codex and Google Gemini CLI, into Claude Code, including instruction files, MCP servers, commands, subagents, and skills. Add --dry-run to preview without writing anything, or --yes to skip the interactive picker. In -p mode it lists what it found and prints the command that confirms the import. Not available on Amazon Bedrock, Google Cloud's Agent Platform, Microsoft Foundry, or Claude Platform on AWS, or when feature-flag fetching is turned off. Requires v2.1.213 or later"
    argument-hint: "[codex|gemini] [--dry-run] [--yes]"
  - name: init
    description: "Initialize project with a CLAUDE.md guide. Set CLAUDE_CODE_NEW_INIT=1 for an interactive flow that also walks through skills, hooks, and personal memory files. If it finds configuration from a coding agent that /import supports, it offers to carry that over"
  - name: insights
    description: Generate an HTML report analyzing your recent sessions on this machine (project areas, interaction patterns, friction points, and features to try). Not available in cloud sessions
  - name: install-github-app
    description: Install the Claude GitHub App for a repository, with an optional step to set up GitHub Actions workflows and secrets. Walks you through selecting a repo and configuring the integration
  - name: install-slack-app
    description: Install the Claude Slack app. Opens a browser to complete the OAuth flow
  - name: keybindings
    description: Open your keyboard shortcuts file
  - name: list-agents
    description: "List the subagents, agent team teammates, and other Claude Code sessions Claude can message, with the name to use for each. Only available in sessions where cross-session messaging is enabled, and requires v2.1.224 or later; teammate rows and the first line showing this session's own name require v2.1.239 or later. Alias: /peers"
  - name: login
    description: Sign in to your Anthropic account
  - name: logout
    description: Sign out from your Anthropic account
  - name: loops
    description: "List, create, and delete loops"
  - name: mcp
    description: "Manage MCP server connections and OAuth authentication. Run with no argument for the interactive list, `reconnect <server>` to reconnect one disconnected server, or `enable`/`disable` with a server name or `all`. In -p mode, running it with no argument prints a text summary of server status instead of opening the list"
    argument-hint: "[reconnect <server>|enable|disable [<server>|all]]"
  - name: memory
    description: Edit CLAUDE.md memory files, enable or disable auto-memory, and view auto-memory entries
  - name: mobile
    description: "Show QR code to download the Claude mobile app. Aliases: /ios, /android"
  - name: model
    description: Switch the AI model and save it as the default for new sessions. For models that support it, use left/right arrows to adjust effort level. Without an argument, opens a picker; press `s` on a row to switch for the current session only. The picker asks for confirmation when the conversation has prior output, since the next response re-reads the full history without cached context. Once confirmed, the change applies without waiting for the current response to finish. Also available in -p mode with a model argument instead of the picker, where it applies to the current session only and is not saved as your default
    argument-hint: "[model]"
  - name: passes
    description: Share a free week of Claude Code with friends. Only visible if your account is eligible
  - name: pause-memory
    description: "Pause automemory for this session. Aliases: /memory-pause, /toggle-memory"
  - name: permissions
    description: "Manage allow, ask, and deny rules for tool permissions. Opens an interactive dialog to view rules by scope, add or remove rules, manage working directories, and review recent auto mode denials. Can also be opened while Claude is responding; the dialog appears immediately and your changes apply starting with Claude's next tool call in the same turn, which requires v2.1.234 or later. Alias: /allowed-tools"
  - name: plan
    description: "Enter plan mode directly from the prompt. Pass an optional description to enter plan mode and immediately start with that task, for example /plan fix the auth bug"
    argument-hint: "[description]"
  - name: plugin
    description: "Manage Claude Code plugins. Run with no argument to open the plugin menu, or pass a subcommand such as list, install, enable, or disable to act directly. Claude Code can activate a plugin during the install; the install summary tells you whether it did or whether to run /reload-plugins"
    argument-hint: "[subcommand]"
  - name: powerup
    description: Discover Claude Code features through quick interactive lessons with animated demos
  - name: privacy-settings
    description: View and update your privacy settings. Only available for Pro and Max plan subscribers
  - name: radio
    description: Open Claude FM lo-fi radio in your browser. Prints the stream URL when no browser is available. Not available on Amazon Bedrock, Google Cloud's Agent Platform, Microsoft Foundry, or Claude Platform on AWS
  - name: recap
    description: Generate a one-line summary of the current session on demand, separately from the automatic session recap that appears after you have been away
  - name: release-notes
    description: View the changelog in an interactive version picker. Select a specific version to see its release notes, or choose to show all versions. The notes appear in your transcript without entering the conversation Claude sees
  - name: reload-plugins
    description: "Reload all active plugins to apply pending changes without restarting. Reports counts for each reloaded component and flags any load errors. When the reload would change which MCP tools are loaded and invalidate the prompt cache, it warns and skips unless you pass --force"
    argument-hint: "[--force]"
  - name: reload-skills
    description: Re-scan skill and command directories so changes on disk become available without restarting the session. Reports how many skills are available and how many were added or removed
  - name: remote-control
    description: "Make this session available for Remote Control from claude.ai. Running it while signed out prints that Remote Control requires a claude.ai subscription and tells you how to sign in. Alias: /rc"
  - name: remote-env
    description: Choose the default environment for cloud agents
  - name: rename
    description: Rename the current session and show the name on the prompt bar. Without a name, auto-generates one from conversation history. Also available in -p mode. From every rename surface, control and invisible characters are replaced with spaces and the name is capped at 200 characters; a name that is empty once invisible characters are removed is rejected. When another live session on this machine already uses the name you pass, a variant of it is applied instead. Requires v2.1.221 or later for the sanitizing and length cap
    argument-hint: "[name]"
  - name: resume
    description: "Resume a conversation by ID or name, or open the session picker. Background sessions appear marked bg; a running one cannot be resumed here, so attach to it from claude agents or stop it there first. Alias: /continue"
    argument-hint: "[session]"
  - name: review
    description: "Alias of /code-review as of v2.1.223: reviews the current diff, or a PR number, branch, or path you pass, such as /review 1234, and takes the same effort levels and flags. For a deep cloud review use /code-review ultra. Earlier versions ran a fast, single-pass, read-only review of a GitHub pull request by number"
    argument-hint: "[low|medium|high|xhigh|max|ultra] [--fix] [--comment] [pr#|branch|path]"
  - name: rewind
    description: "Rewind the conversation and/or code to a previous point, or summarize from a selected message. See checkpointing. Aliases: /checkpoint, /undo"
  - name: sandbox
    description: Toggle sandbox mode. Available on supported platforms only
  - name: schedule
    description: "Create, update, list, or run routines (Cloud scheduled tasks). Claude walks you through the setup conversationally, and you can also ask about a routine's recent runs. Alias: /routines"
    argument-hint: "[description]"
  - name: scroll-speed
    description: Adjust mouse wheel scroll speed interactively, with a ruler you can scroll while the dialog is open to preview the change. Available in fullscreen rendering only and not in the JetBrains IDE terminal
  - name: security-review
    description: Analyze the changes on the current branch for security vulnerabilities. Reviews the diff between your branch and origin's default branch, identifying risks like injection, auth issues, and data exposure. Needs an origin remote
  - name: session
    description: "Show cloud session URL and QR code. Alias: /remote"
  - name: setup-bedrock
    description: Configure Amazon Bedrock authentication, region, and model pins through an interactive wizard. Only visible when CLAUDE_CODE_USE_BEDROCK=1 is set. First-time users can also reach this wizard from the login screen
  - name: setup-vertex
    description: Configure Google Cloud's Agent Platform authentication, project, region, and model pins through an interactive wizard. Only visible when CLAUDE_CODE_USE_VERTEX=1 is set. First-time users can also reach this wizard from the login screen
  - name: skill-doctor
    description: Show which loaded skills are unused and costing context
  - name: skills
    description: List available skills. Type to filter by name, press `t` to sort by token count, or press `Space` to cycle a skill's visibility to Claude and the / menu, then `Enter` to save
  - name: status
    description: "Open the Settings interface (Status tab) showing version, model, account, and connectivity. As of v2.1.221 it also shows the session kind: interactive, or a background job that is attached or unattended. Works while Claude is responding"
  - name: statusline
    description: "Configure Claude Code's status line. Describe what you want, or run without arguments to auto-configure from your shell prompt"
  - name: stickers
    description: Order Claude Code stickers
  - name: stop
    description: Stop the current background session. Only available while attached to a background session; the transcript and any worktree are kept. To detach without stopping, use /exit or press the left arrow key
  - name: subtask
    description: "Spawn a forked subagent: a background subagent that inherits the full conversation and works on the task while you keep working, returning its result to this conversation when it finishes. To copy the conversation into a separate background session instead, use /fork. Requires v2.1.212 or later, and is unavailable when agent view is turned off, where /fork keeps the forked-subagent behavior"
    argument-hint: "<task>"
  - name: tasks
    description: "View and manage background work in the current session, including subagents that have finished. Alias: /bashes"
  - name: team-onboarding
    description: Generate a teammate onboarding guide from the past 30 days of sessions, commands, and MCP server usage, as a markdown guide a teammate can paste as a first message. claude.ai subscribers on Pro, Max, Team, and Enterprise plans also get a share link teammates can open directly in Claude Code
  - name: teleport
    description: "Pull a Claude Code on the web session into this terminal: opens a picker, then fetches the branch and conversation. Requires a claude.ai subscription. Alias: /tp"
  - name: terminal-setup
    description: Configure terminal keybindings for Shift+Enter and other shortcuts. Only visible in terminals that need it, like VS Code, Cursor, Devin Desktop, Alacritty, or Zed
  - name: theme
    description: "Change the color theme. Includes an auto option that follows the terminal's dark/light mode, light/dark variants, colorblind-accessible (daltonized) themes, ANSI themes that use the terminal's palette, and custom themes from ~/.claude/themes/ or plugins. Select `New custom theme…` to create one"
  - name: tui
    description: "Set the terminal UI renderer and relaunch into it with your conversation intact. fullscreen enables the flicker-free alt-screen renderer. Without an argument, prints the active renderer"
    argument-hint: "[default|fullscreen]"
  - name: ultrareview
    description: "Run a deep, multi-agent code review in a cloud sandbox. Pass a PR reference to review that pull request, or a branch name to change the comparison base. The preferred invocation is now /code-review ultra; /ultrareview remains as an alias. Includes 3 free runs on Pro and Max, then requires usage credits"
    argument-hint: "[PR or branch]"
  - name: update
    description: "Switch to the latest version without losing the conversation. Alias: /restart"
  - name: upgrade
    description: Open the upgrade page in your browser to switch to a higher plan tier. When the browser fails to open, it shows a sign-in prompt without printing the URL
  - name: usage
    description: "Show session cost, plan usage limits, and activity stats. On Pro, Max, Team, and Enterprise plans, includes a breakdown of usage by skill, subagent, plugin, and MCP server. Aliases: /cost, /stats"
  - name: usage-credits
    description: "Configure usage credits, or request them from your admin, when you hit a limit. Opens your usage-credits billing settings in the browser; Team and Enterprise members without billing access instead send a usage-credits request to their admin from the CLI after confirming in a dialog. When no browser can open, for example over SSH, the URL is printed instead. Renamed from /extra-usage"
  - name: version
    description: "Print the version this session is running, which can differ from what autoupdate has already downloaded"
  - name: voice
    description: Toggle voice dictation, or enable it in a specific mode. Requires a Claude.ai account
    argument-hint: "[hold|tap|off]"
  - name: web-setup
    description: Connect GitHub account to Claude Code on the web using local gh CLI credentials. /schedule prompts for this automatically if GitHub is not connected
  - name: workflows
    description: Open the workflow progress view to watch, pause, resume, or save running and completed workflows
skills:
  - name: artifact-capabilities
    description: "Runtime capabilities a published Artifact page can be granted — behavior static HTML cannot provide on its own, such as the page reading live or connected data, keeping state shared across viewers, or updating and republishing itself. Serves this user's live capability roster and the typed call definitions"
  - name: artifact-components
    description: Embed reusable components in an Artifact
  - name: artifact-design
    description: Design guidance and fundamentals for Artifacts
  - name: artifact-diagramming
    description: Diagramming guidance for Artifacts
  - name: artifact-pr-review
    description: Publish a PR review briefing Artifact from a template
  - name: batch
    description: "Research and plan a large-scale change, then execute it in parallel across 5–30 isolated worktree agents that each run tests and open a PR. Requires a git repository."
    argument-hint: "<instruction>"
  - name: claude-api
    description: "Load Claude API reference material for your project's language (Python, TypeScript, Java, Go, Ruby, C#, PHP, or cURL) and Managed Agents reference. Covers tool use, streaming, batches, structured outputs, and common pitfalls. Subcommands: `migrate` upgrades existing Claude API code to a newer model, `upgrade` moves your project's Anthropic SDK dependency across a major version (currently the Python `anthropic` package from 0.x to 1.x), `managed-agents-onboard` walks through creating a Managed Agent, and `prompt-audit` flags instructions written for older models in your prompts, skills, and tool descriptions and proposes fixes as a diff. `prompt-audit` requires v2.1.221 or later and `upgrade` requires v2.1.236 or later. Also activates automatically when your code imports `anthropic` or `@anthropic-ai/sdk`."
    argument-hint: "[migrate|upgrade|managed-agents-onboard|prompt-audit]"
  - name: claude-code-docs
    description: Answer questions about Claude Code features and settings
  - name: claude-in-chrome
    description: "Automate your Chrome browser to interact with web pages: click elements, fill forms, capture screenshots, read console logs, and navigate sites. Opens pages in new tabs within your existing Chrome session, and requires site-level permissions configured in the extension"
  - name: code-review
    description: "Review the current diff, or a PR number, branch, or path you pass, for correctness bugs and reuse/simplification/efficiency cleanups at the given effort level. Lower effort returns fewer, higher-confidence findings; high through max give broader coverage; `ultra` runs a deep multi-agent cloud review. With no effort level, reuses the level you typed last, falling back to the session's effort level if you have never typed one. Runs as a background subagent so review work stays out of your conversation. Pass `--fix` to apply findings to the working tree, or `--comment` to post inline PR comments. With `ultra` on a github.com PR target, `--post` preselects posting the finished findings to the PR in the launch dialog. Alias: /review"
    argument-hint: "[low|medium|high|xhigh|max|ultra] [--fix] [--comment] [pr#|branch|path]"
  - name: code-walkthrough
    description: Generate an interactive walkthrough artifact for code
  - name: commit
    description: "Create a git commit. Use whenever you are about to create a commit, whether you asked for one or it is a step in the current task — it gathers git context and applies the required commit workflow (message style, staging rules, attribution)"
  - name: dataviz
    description: "Design guidance for charts, graphs, and dashboards. Picks the chart form for the data, assigns color by role, validates the palette for colorblind safety and contrast with a bundled script, and applies mark, interaction, and accessibility rules. Uses a brand-neutral placeholder palette that you replace with your own."
    argument-hint: "[request]"
  - name: debug
    description: Enable debug logging for the current session and troubleshoot issues by reading the session debug log. Logging is off unless you started with `claude --debug`, so running /debug mid-session captures logs from that point forward. Optionally describe the issue to focus the analysis.
    argument-hint: "[description]"
  - name: deep-research
    description: "Fan out web searches, fetch and cross-check sources, then synthesize a cited research report."
    argument-hint: "<question>"
  - name: design
    description: "Work with Claude Design (claude.ai/design): create, import, export, sync, and manage agent access"
    argument-hint: "[consent|revoke]"
  - name: design-sync
    description: "Convert your repo's React design system and upload it to Claude Design so designs use your real components. Optionally name the design system. A first sync can take a few hours on a large repo. Unavailable on Amazon Bedrock, Google Cloud Agent Platform, Microsoft Foundry, and Claude Platform on AWS."
    argument-hint: "[hint]"
  - name: doctor
    description: "Run a setup checkup that diagnoses issues and can fix them. Checks installation health, including duplicate or leftover installs, PATH problems, and unparseable settings, finds unused skills, MCP servers, and plugins versus their context cost, flags slow hooks, and checks for a newer version on your release channel. Deduplicates local CLAUDE.md files against checked-in ones, trims content Claude could derive from the codebase, and moves the always-loaded guidance that remains into skills and nested CLAUDE.md files that load on demand. Also offers to make auto mode your default and to pre-approve frequently denied read-only commands. Reports findings first and asks for confirmation before changing anything. Alias: /checkup"
  - name: fewer-permission-prompts
    description: Scan your transcripts for common read-only Bash and MCP tool calls, then add a prioritized allowlist to project `.claude/settings.json` to reduce permission prompts.
  - name: loop
    description: "Run a prompt or slash command repeatedly while the session stays open. Omit the interval and Claude self-paces between iterations. Omit the prompt to run an autonomous maintenance check (or the prompt in .claude/loop.md). Alias: /proactive"
    argument-hint: "[interval] [prompt]"
  - name: plan-artifact
    description: "Publish an implementation plan, design doc, or RFC as a shareable Artifact"
  - name: pr-explainer
    description: "Generate a shareable walkthrough artifact for a pull request: what changed, why, and a reviewer-oriented before/after narrative"
  - name: prototype
    description: Prototype an idea as a working Artifact
  - name: run
    description: "Launch and drive your project's app to see a change working in the running app. Looks for a project skill that already covers launching the app; otherwise falls back to built-in patterns per project type."
  - name: run-skill-generator
    description: "Teach /run and /verify how to build, launch, and drive your project's app from a clean environment."
  - name: simplify
    description: "Review the changed code for cleanup opportunities and apply the fixes. Four review agents run in parallel, covering reuse of existing helpers, simplification, efficiency, and whether the change is at the right level of abstraction. It does not hunt for correctness bugs — use /code-review for that. Pass a path or PR reference to review a specific target."
    argument-hint: "[target]"
  - name: update-config
    description: "Change settings in settings.json: hooks, permissions, and environment variables"
  - name: verify
    description: "Confirm a code change does what it should by building your project's app, running it, and observing the result, rather than relying on tests or type checks."
  - name: whiteboard
    description: Sketch on a whiteboard Artifact you can send back to Claude
  - name: workshop
    description: Workshop a document through decisions presented as an Artifact
agents:
  - name: Explore
    description: A fast, read-only agent optimized for searching and analyzing codebases.
  - name: Plan
    description: A research agent used during plan mode to gather context before presenting a plan.
  - name: general-purpose
    description: A capable agent for complex, multi-step tasks that require both exploration and action.
  - name: statusline-setup
    description: When you run /statusline to configure your status line
  - name: claude-code-guide
    description: When you ask questions about Claude Code features
  - name: claude
    description: A catch-all with every tool available to subagents, used when a task doesn't fit a more specialized agent. Also the default agent for a dispatched background session, where the starting permission mode depends on how the session was started
