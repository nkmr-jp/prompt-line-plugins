name: agy
description: Antigravity CLI (AGY) built-in commands and workflows
color: indigo  # You can also use hex codes like "#4285F4"
references:
  - https://antigravity.google/docs/cli/reference
  - https://antigravity.google/docs/cli/features
  - https://antigravity.google/docs/skills
  - https://antigravity.google/changelog

commands:
  - name: add-dir
    description: Add a workspace directory for file access during the current session
    argument-hint: "<path>"
  - name: agents
    description: List available custom agents and select an agent for the session
  - name: artifact
    description: "Browse, view, or review generated artifacts and walkthroughs. Alias: /artifacts"
  - name: btw
    description: "Ask a quick side question without adding to the conversation context. Usage: /btw <question>"
    argument-hint: "<question>"
  - name: changelog
    description: Show release notes and recent changes
  - name: clear
    description: "Clear conversation history and start a new session. Aliases: /reset, /new"
  - name: codesearch
    description: "Open a fullscreen Code Search panel that searches the code in your workspace without leaving the session, showing matches grouped by file with surrounding context; press Enter to open a result in the file viewer at the matching line, or Ctrl+G in your external editor, and comment on specific lines to send line-level feedback to the agent. Queries are regular expressions with smart case by default; add -F (or --literal) for fixed-string matching, and filter by path with f:<glob> (aliases file:, path:), prefixed with - to exclude. Aliases: /cs, /search"
    argument-hint: "<query> [-F|--literal] [f:glob]"
  - name: compact
    description: "Compact the conversation on demand to free up the context window. On its own it summarizes the conversation and ends the turn; with a message it summarizes and then answers that message. Shows a Compacting conversation... progress label you can cancel with Esc, then reports how many steps were summarized and how much smaller the context became (1.3.5 or later). Images, PDFs, and other files you attached are kept in the summary so the agent can still see them (1.4.6 or later)"
    argument-hint: "[message]"
  - name: config
    description: "Open the interactive settings panel to adjust preferences and configuration. Agent Mode includes Auto mode (1.3.5 or later on Linux and macOS; 1.4.4 or later on Windows 11 version 24H2 and later for personal Google Accounts), which approves file edits and safe commands without asking but still prompts before irreversible actions. Verbosity offers high, medium, and low (medium is the default since 1.3.0; set it back to high to see every tool call, command, and thought in full); medium groups related tool calls and thoughts into concise summaries such as `Explored N files` while keeping commands and responses visible. Queued Messages chooses whether follow-up messages wait until the current turn ends (Queue, the default) or interrupt the agent (Send Immediately); also settable with \"queuedMessages\": \"send-immediately\" in settings.json; press alt+m to send a message with the opposite of this setting (1.4.0 or later). On a highlighted setting, ←/→ switch to the previous or next value and save it right away without opening the dropdown (1.2.16 or later). Alias: /settings"
  - name: context
    description: View detailed context breakdown, token consumption, and model limits
  - name: copy
    description: Copy the latest completed assistant output or response to clipboard
  - name: credits
    description: Show remaining G1 credits balance and subscription purchase link
  - name: diff
    description: "View uncommitted working tree changes and per-turn diffs. The file view has syntax highlighting and folds unchanged lines: each hunk header shows how many lines are hidden, Ctrl+O expands or collapses the nearest fold, and f toggles between changes only and the whole file (1.3.5 or later). The Commit Tree and Per Turn views also support f and Ctrl+O, and Per Turn combines multiple edits to a file in one turn into a single diff (1.4.4 or later). Press / to search the file list and file view: matches are highlighted as you type, Enter jumps to the first match, and n/N step through matches across every file (1.4.3 or later); matches inside folded lines are counted as hidden, and f shows them (1.4.5 or later). The exact words that changed within each modified line are highlighted in every color scheme (1.4.6 or later). In Per Turn, [ and ] jump to the first file of the previous or next turn, wrapping around at either end (1.4.8 or later)"
  - name: effort
    description: "Set the reasoning effort for the current model from an effort gauge that reflects the levels each model supports; the gauge is also available in /model. Usage: /effort [low|medium|high]"
    argument-hint: "[low|medium|high]"
  - name: exit
    description: "Exit the Antigravity CLI. Alias: /quit"
  - name: feedback
    description: "Submit feedback, logs, or bug reports to the Antigravity team. Alias: /bug"
  - name: fork
    description: "Fork the current conversation into a new thread or branch. Alias: /branch"
  - name: help
    description: Show available slash commands, keybindings, and help information
  - name: hooks
    description: Manage lifecycle hook configurations for tool and agent events
  - name: keybindings
    description: View and configure custom keyboard shortcuts and keybindings
  - name: logout
    description: Log out of your Google account or active session
  - name: mcp
    description: Manage Model Context Protocol (MCP) server configurations and tools
  - name: model
    description: Set or switch the active foundation model for the current session, or run a single prompt on another model and then return the session to the model it was using. A base model name without an effort level picks that model's default thinking level
    argument-hint: "[model]"
  - name: open
    description: "Open a specified file in your configured editor. Usage: /open <file_path>"
    argument-hint: "<file_path>"
  - name: permissions
    description: Manage tool permission rules, approval decisions, and security policies
  - name: plugin
    description: "Interactive manager for the official Antigravity plugin marketplace: browse and install plugins that bundle skills, MCP servers, subagents, rules, and hooks, install one from a local directory, fill in any settings a plugin needs before it turns on, and manage installed plugins with /plugin install, uninstall, enable, disable, and list. Installed plugins have a Configure MCP servers... row for setting or changing their MCP server variables at any time without disabling and re-enabling them; plugins with missing values show ⚠ needs setup, and saving restarts an enabled plugin's servers (1.4.6 or later). The Discover tab groups marketplace plugins into the same sections as the Antigravity plugin marketplace, listing a plugin under every section it belongs to (1.4.9 or later). Long shelves show their first 6 plugins followed by a ⋯ N more — enter to show row; Ctrl+E expands or collapses the shelf under the cursor, and [ and ] jump to the previous or next shelf (1.4.11 or later)"
  - name: remote-control
    description: "Toggle Remote Control for the active terminal session: creates a session-scoped connection so you can follow and control the session from another device, printing the session's hostname and a link to the conversation. The tunnel lasts only while the CLI instance is open; /remote-control off or exiting the session tears it down. Equivalent to launching with --remote-control; for an always-on machine-wide connection use agy remote-control start. Hidden when signed in with Application Default Credentials (AGY_ADC_AUTH), which Remote Control does not support yet"
    argument-hint: "[on|off]"
  - name: rename
    description: Rename the current conversation thread
    argument-hint: "[name]"
  - name: resume
    description: "Resume a previous conversation by ID or browse conversation history. Ctrl+F toggles between a flat list and conversations grouped by workspace directory; the pickerGrouping setting sets the default view. Aliases: /switch, /conversation"
    argument-hint: "[conversation-id]"
  - name: rewind
    description: "Rewind the conversation to a previous turn or checkpoint. Alias: /undo"
  - name: skills
    description: List and manage active ambient, global, and workspace skills
  - name: statusline
    description: "Toggle statusline on/off or configure a custom shell command to render the statusline. Usage: /statusline [<command>]"
    argument-hint: "[<command>]"
  - name: tasks
    description: View and manage background subagents, tasks, and worker processes. Since 1.3.1 it also lists timers and recurring jobs the agent schedules and other tools running in the background, shown as completed or failed
  - name: title
    description: "Set or toggle the terminal title. Usage: /title [on|off]"
    argument-hint: "[on|off]"
  - name: usage
    description: "View model quota usage and rate limits. Alias: /quota"
  - name: voice
    description: "Dictate a prompt using your microphone (toggle voice dictation). Alias: /record"

skills:
  - name: boost
    description: Activate high-powered deep thinking, strategic planning, multiple perspectives, and rigorous verification
  - name: browser
    description: Automate web browsing, search the web, and interact with web applications via headless browser
  - name: goal
    description: Run a long-running autonomous task (e.g., overnight) and not stop until the goal is fully achieved
    argument-hint: "<goal>"
  - name: grill-me
    description: Conduct an interactive interview to align on design decisions and clarify requirements before starting work
  - name: learn
    description: Persist user corrections, learned preferences, or complex environment setups for future sessions
  - name: plan
    description: Formulate and align on a detailed multi-step implementation plan before executing code changes
    argument-hint: "[task]"
  - name: schedule
    description: Schedule a recurring cron job or one-shot background timer notification
    argument-hint: "[instruction]"
  - name: teamwork-preview
    description: "Orchestrate a team of autonomous subagents working collaboratively across pipeline stages. Alias: /teamwork"
