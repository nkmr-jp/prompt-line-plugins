# OpenAI Codex CLI built-in
#
# Color property supports both named colors and hex color codes:
# - Named colors: grey, darkGrey, slate, stone, red, rose, orange, amber, yellow, lime, green, emerald, teal, cyan, sky, blue, indigo, violet, purple, fuchsia, pink
# - Hex codes: #RGB or #RRGGBB (e.g., #00CC66, #0C6)

name: codex
description: Codex CLI built-in commands
color: sky  # You can also use hex codes like "#00CC66"
reference: https://learn.chatgpt.com/docs/developer-commands?surface=cli

commands:
  - name: agents
    description: "Open the agent command center: an overview of chats on the connected server where you can inspect their status and switch between them. Requires a shared local or remote server; run codex agents to open it directly from your terminal"
  - name: app
    description: Continue the current session in the desktop app
  - name: approve
    description: Approve one retry of a recent automatic-review denial. Only available while automatic review is active
  - name: apps
    description: Browse apps (connectors) and insert them into your prompt
  - name: archive
    description: Archive the current session and exit Codex
  - name: cd
    description: "Change the session's working directory and continue the chat there; without a path, uses your home directory. Requires an idle primary session with no queued input or background terminals"
    argument-hint: "[path]"
  - name: clear
    description: Clear the terminal and start a fresh chat, optionally naming it
    argument-hint: "[name]"
  - name: cloud
    description: Run the chat in the cloud, when cloud execution is available
  - name: cloud-environment
    description: Choose the cloud environment for the chat
  - name: compact
    description: Summarize the visible conversation to free tokens
  - name: copy
    description: Copy the latest completed Codex output
  - name: daemon
    description: "Open background server controls: review the server connection, then install the latest public stable release or use the current CLI build for the local background server. Confirming an update exits Codex and may interrupt active work. For a remote connection, manage the server on its host"
  - name: debug-config
    description: Print config layer and requirements diagnostics
  - name: delete
    description: Permanently delete the current session and exit Codex
  - name: diff
    description: Show the Git diff, including files Git isn't tracking yet
  - name: experimental
    description: Toggle experimental features
  - name: export
    description: "Export the complete conversation as Markdown, copying it to the clipboard or saving it to a file (for example /export session.md). Wait for the current turn to finish before exporting"
    argument-hint: "[file]"
  - name: fast
    description: Toggle Fast mode for supported models
    argument-hint: "[on|off|status]"
  - name: feedback
    description: Submit logs and diagnostics to maintainers
  - name: fork
    description: Clone current conversation into new thread
  - name: goal
    description: Set, edit, pause, resume, view, or clear a task goal
    argument-hint: "[<objective>|edit|pause|resume|clear]"
  - name: hooks
    description: Review lifecycle hooks and view/manage hook configuration loaded into the current session
  - name: ide
    description: Include open files, current selection, and other IDE context
    argument-hint: "[text]"
  - name: ide-context
    description: Turn automatic IDE context on or off
  - name: import
    description: Import Claude Code or Cursor setup, project files, and recent chats. Session discovery covers up to 50 chats from the last 30 days
  - name: init
    description: Generate an AGENTS.md scaffold in the current directory
  - name: keymap
    description: Inspect and remap keyboard shortcuts
  - name: local
    description: Run the chat in your local workspace
  - name: logout
    description: Clear local credentials for current user
  - name: mcp
    description: List available Model Context Protocol tools
    argument-hint: "[verbose]"
  - name: memories
    description: Configure memory use, including memory injection and generation
  - name: mention
    description: Attach specific files or folders to conversation
    argument-hint: "<file_path>"
  - name: model
    description: Choose active model and reasoning effort level
  - name: new
    description: Start fresh conversation within same CLI session, optionally naming it
    argument-hint: "[name]"
  - name: permissions
    description: "Set what Codex can do without asking first. Alias: /approvals"
  - name: personality
    description: Select communication style (friendly, pragmatic, none)
  - name: pets
    description: "Choose or hide a terminal pet. Alias: /pet"
    argument-hint: "[off]"
  - name: plan
    description: Switch to plan mode and optionally send a prompt
    argument-hint: "[prompt]"
  - name: plugins
    description: Inspect installed and discoverable plugins with their tools
  - name: project
    description: Choose a project for new chats
  - name: ps
    description: Display background terminals and recent output
  - name: pwd
    description: "Show the working directory the active session uses. Alias: /cwd"
  - name: quit
    description: "Exit the CLI immediately. Alias: /exit"
  - name: raw
    description: Toggle raw scrollback rendering for better terminal text selection
    argument-hint: "[on|off]"
  - name: reasoning
    description: Choose the reasoning effort for the current chat
  - name: recap
    description: "Generate a summary of the current conversation without compacting its context, even if tui.auto_recap = false. Run it while Codex is idle; use /compact to free context space"
  - name: rename
    description: Rename the current session
    argument-hint: "[name]"
  - name: resume
    description: Reload a previously saved conversation
  - name: review
    description: Start code review mode to review uncommitted changes, or compare against a base branch
  - name: sandbox-add-read-dir
    description: Grant read access to directories outside current roots (Windows only)
    argument-hint: "<absolute_directory_path>"
  - name: setup-default-sandbox
    description: Configure the elevated Windows sandbox
  - name: side
    description: "Start an ephemeral side conversation. Alias: /btw"
    argument-hint: "[prompt]"
  - name: skills
    description: Browse and apply task-specific skill context
  - name: status
    description: Show the chat ID, context usage, and rate limits
  - name: statusline
    description: Configure and reorder footer status-line items (model, context, limits, git, tokens, session), persisted in config.toml
  - name: stop
    description: "Cancel all background terminals for the current session. Alias: /clean"
  - name: subagents
    description: "Switch the active subagent thread to inspect or continue that agent's work. Formerly /agent"
  - name: theme
    description: Preview and persist a terminal syntax-highlighting theme
  - name: title
    description: Configure terminal window or tab title fields interactively, picking and reordering items such as project, status, thread, branch, model, and task progress
  - name: tui
    description: "Choose the terminal mode (scrollback or fullscreen) for the next launch; restart Codex to apply it. Launch overrides such as --no-alt-screen still apply"
  - name: usage
    description: View account token usage, or use a rate-limit reset
    argument-hint: "[daily|weekly|cumulative]"
  - name: vim
    description: Toggle Vim mode for composer editing
  - name: warnings
    description: "View retained warnings and their diagnostic details"
  - name: worktree
    description: "Start a new chat or continue the current conversation in a managed Git worktree. Browse worktrees finds existing worktrees and their owner chats. Requires local worktree support and is unavailable while a task is running"
