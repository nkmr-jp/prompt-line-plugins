# OpenAI Codex CLI 組み込みスラッシュコマンド
#
# color プロパティは名前付きカラーと16進カラーコードの両方に対応:
# - 名前付きカラー: grey, darkGrey, slate, stone, red, rose, orange, amber, yellow, lime, green, emerald, teal, cyan, sky, blue, indigo, violet, purple, fuchsia, pink
# - 16進コード: #RGB or #RRGGBB (例: #00CC66, #0C6)

name: codex
description: Codex CLI 組み込みコマンド
color: sky  # 16進コードも使用可能 例: "#00CC66"
reference: https://learn.chatgpt.com/docs/developer-commands?surface=cli

commands:
  - name: agents
    description: "エージェントのコマンドセンターを開く。接続中のサーバー上のチャットを一覧し、状態を確認して切り替えられる。共有のローカルまたはリモートサーバーが必要。ターミナルから直接開くには codex agents を実行する"
  - name: app
    description: 現在のセッションをデスクトップアプリに引き継ぐ
  - name: approve
    description: 直近の自動レビューによる拒否を一度だけ承認して再試行する。自動レビューが有効な場合のみ利用できる
  - name: apps
    description: アプリ（コネクタ）を閲覧してプロンプトに挿入する
  - name: archive
    description: 現在のセッションをアーカイブしてCodexを終了する
  - name: cd
    description: "セッションの作業ディレクトリを変更し、そのディレクトリでチャットを続ける。パスを省略するとホームディレクトリを使う。キュー済みの入力やバックグラウンドターミナルが無い、アイドル状態のプライマリセッションでのみ実行できる"
    argument-hint: "[path]"
  - name: clear
    description: ターミナルをクリアして新しいチャットを開始する。名前を指定することもできる
    argument-hint: "[name]"
  - name: cloud
    description: クラウド実行が利用可能な場合に、チャットをクラウドで実行する
  - name: cloud-environment
    description: チャットで使用するクラウド環境を選択する
  - name: compact
    description: 表示中の会話を要約してトークンを解放する
  - name: config
    description: テーマ・通知・キーボードショートカット・テキスト選択などのターミナル設定を検索・変更する。グループ別に閲覧するか / キーで検索でき、変更は自動保存される
  - name: copy
    description: "応答・コードブロック・引用をコピーする。スクロールバックモードでは最新の完了済み応答全体・コードブロック・引用から選び、フルスクリーンモードではトランスクリプト内のブロックを選択する。/status の後に使うとステータス全体または個別の項目をコピーできる。最新の完了済み応答は Ctrl+O で直接コピーできる"
  - name: daemon
    description: "バックグラウンドサーバーの管理画面を開く。サーバー接続を確認し、ローカルのバックグラウンドサーバーに最新の公開安定版をインストールするか、現在の CLI ビルドを使うかを選べる。更新を確定すると Codex が終了し、実行中の作業が中断されることがある。管理対象のローカルサーバーは「Restart background server」で再起動でき、Codex は自動で再接続する（他のチャットの実行中・キュー中の作業が中断されることがある）。リモート接続の場合はサーバーのホスト側で管理する"
  - name: daybreak
    description: OpenAI プロバイダーを使用し、アカウントとモデルが対象の場合に Daybreak（承認制のサイバーアクセスプログラム）のオン／オフを切り替える。現在のチャットに適用され、以降のチャットのデフォルトとしても保存される
  - name: debug-config
    description: 設定レイヤーと要件の診断情報を表示する
  - name: delete
    description: 現在のセッションを完全に削除してCodexを終了する
  - name: diff
    description: Git未追跡ファイルを含むGit diffを表示する
  - name: experimental
    description: 実験的機能を切り替える
  - name: export
    description: "会話全体を Markdown としてエクスポートする。クリップボードへのコピーかファイルへの保存（例: /export session.md）を選べる。現在のターンが終わってから実行する"
    argument-hint: "[file]"
  - name: fast
    description: 対応モデルのFastモードを切り替える
    argument-hint: "[on|off|status]"
  - name: feedback
    description: メンテナーにログと診断情報を送信する
  - name: fork
    description: 現在の会話を新しいスレッドにクローンする
  - name: goal
    description: タスクの目標を設定・編集・一時停止・再開・確認・クリアする
    argument-hint: "[<objective>|edit|pause|resume|clear]"
  - name: hooks
    description: ライフサイクルフックを確認し、現在のセッションに読み込まれたフック設定を表示・管理する
  - name: ide
    description: 開いているファイル・現在の選択範囲などのIDEコンテキストを取り込む
    argument-hint: "[text]"
  - name: ide-context
    description: 自動IDEコンテキストのオン/オフを切り替える
  - name: import
    description: Claude CodeまたはCursorのセットアップ・プロジェクトファイル・最近のチャットをインポートする。チャットは直近30日から最大50件が対象。ローカルデーモンやリモートサーバーに接続中は、そのサーバーが動くマシン上のファイルを読み込んでインポートする。実行中のタスクが終わってから開始すること
  - name: init
    description: 現在のディレクトリにAGENTS.mdのひな形を生成する
  - name: keymap
    description: キーボードショートカットを確認・再マッピングする
  - name: local
    description: チャットをローカルワークスペースで実行する
  - name: logout
    description: 現在のユーザーのローカル認証情報をクリアする
  - name: mcp
    description: "利用可能なModel Context Protocolツールを一覧表示する。`/mcp login <name>` で設定済みのMCPサーバーにサインインする"
    argument-hint: "[verbose|login <name>]"
  - name: memories
    description: メモリの注入や生成を含む、メモリの利用方法を設定する
  - name: mention
    description: 特定のファイルやフォルダを会話にアタッチする
    argument-hint: "<file_path>"
  - name: model
    description: "使用するモデルと推論レベルを選択する。引数なしではピッカーを開く。モデル・--reasoning <level>・--speed <tier> を渡すと（スペース区切り・= 区切りどちらも可）保存済みのデフォルトを変えずに現在のセッションだけを変更でき、モデルを省略すると現在のモデルに設定を適用する（0.164.0 以降）"
    argument-hint: "[model] [--reasoning <level>] [--speed <tier>]"
  - name: new
    description: 同じCLIセッション内で新しい会話を開始する。名前を指定することもできる
    argument-hint: "[name]"
  - name: permissions
    description: "Codexが確認なしで実行できる操作を設定する。引数なしではピッカーを開く。組み込みまたはカスタムの権限プロファイル ID を渡すと直接選択でき（例: /permissions :read-only）、:ask-for-approval と :approve-for-me も指定できる（0.164.0 以降）。--approval-policy=<policy> と --reviewer=user|auto_review を付けると、このセッションでの承認リクエストの扱いも設定できる。エイリアス: /approvals"
    argument-hint: "[profile-id] [--approval-policy=<policy>] [--reviewer=user|auto_review]"
  - name: personality
    description: コミュニケーションスタイルを選択する（friendly, pragmatic, none）
  - name: pets
    description: "ターミナルペットを選択または非表示にする。エイリアス: /pet"
    argument-hint: "[off]"
  - name: plan
    description: プランモードに切り替え、必要に応じてプロンプトを送信する
    argument-hint: "[prompt]"
  - name: plugins
    description: インストール済みおよび発見可能なプラグインとそのツールを表示する
  - name: presets
    description: "プロンプトやスラッシュコマンドを保存・実行する。n キーでプロンプトやスラッシュコマンドを番号付きスロットに保存し、s キーで現在のモデル・権限・ターミナルタイトル・ステータスラインからプリセットを作成する。プリセットの番号を押すと実行できる"
  - name: project
    description: 新しいチャット用のプロジェクトを選択する
  - name: ps
    description: バックグラウンドターミナルと最新の出力を表示する
  - name: pwd
    description: "アクティブなセッションが使っている作業ディレクトリを表示する。エイリアス: /cwd"
  - name: quit
    description: "CLIを即座に終了する。エイリアス: /exit"
  - name: raw
    description: ターミナルでのテキスト選択を容易にするため、raw スクロールバック表示を切り替える
    argument-hint: "[on|off]"
  - name: reasoning
    description: 現在のチャットの推論レベルを選択する
  - name: recap
    description: "現在の会話の要約を生成する。コンテキストは圧縮せず、tui.auto_recap = false でも実行できる。Codex がアイドル状態のときに使う。コンテキストを空けたい場合は /compact を使う"
  - name: rename
    description: 現在のセッションの名前を変更する
    argument-hint: "[name]"
  - name: resume
    description: "以前に保存した会話をリロードする。ピッカーでは検索範囲を選べる: Cwd（現在のディレクトリ）、Repo（利用可能な場合、リンクされたローカル worktree も含む）、All（全ディレクトリ）"
  - name: review
    description: コードレビューモードを開始し、未コミットの変更をレビューするか、ベースブランチとの差分を比較する
  - name: sandbox-add-read-dir
    description: 現在のルート外のディレクトリへの読み取りアクセスを付与する（Windowsのみ）
    argument-hint: "<absolute_directory_path>"
  - name: setup-default-sandbox
    description: 昇格された Windows サンドボックスを設定する
  - name: side
    description: "一時的なサイド会話を開始する。エイリアス: /btw"
    argument-hint: "[prompt]"
  - name: skills
    description: タスクに特化したスキルコンテキストを閲覧・適用する
  - name: status
    description: チャットID・コンテキスト使用量・レート制限を表示する
  - name: statusline
    description: "フッターのステータスライン項目（model・context・limits・git・tokens・session）を設定・並べ替え、config.toml に永続化する。項目を表示順に並べて渡すとこのセッションだけのフッターを設定でき（例: /statusline model project-name）、--clear でセッション中の全項目を非表示にする"
    argument-hint: "[items...|--clear]"
  - name: stop
    description: "現在のセッションのバックグラウンドターミナルをすべてキャンセルする。エイリアス: /clean"
  - name: subagents
    description: "アクティブなサブエージェントのスレッドを切り替え、そのエージェントの作業を確認・継続する。旧名称は /agent"
  - name: theme
    description: ターミナルのシンタックスハイライトテーマをプレビューして永続化する
  - name: title
    description: "ターミナルウィンドウ／タブのタイトル項目を対話的に設定する。project・status・thread・branch・model・タスク進捗などの項目を選択・並べ替えできる。項目を表示順に並べて渡すとこのセッションだけのタイトルを設定でき（例: /title project-name model）、--clear でセッションのタイトル項目をクリアする"
    argument-hint: "[items...|--clear]"
  - name: tui
    description: "次回起動時のターミナルモード（スクロールバックまたはフルスクリーン）を選ぶ。反映には Codex の再起動が必要。--no-alt-screen などの起動時オプションは引き続き優先される"
  - name: usage
    description: アカウントのトークン使用量を表示する、またはレート制限のリセットを使う
    argument-hint: "[daily|weekly|cumulative]"
  - name: vim
    description: コンポーザー編集用のVimモードを切り替える
  - name: voice
    description: "CLI ビルドとセッションが音声に対応している場合に、音声会話を開始・停止する（F8 でも可）。/voice mute でマイクのオン／オフ、/voice stop で会話の終了、/voice settings で今後の会話で使う声を選ぶ"
    argument-hint: "[mute|stop|settings]"
  - name: warnings
    description: "保持されている警告とその診断詳細を表示する"
  - name: worktree
    description: "管理対象の Git worktree で新しいチャットを始めるか、現在の会話をそこで続ける。Browse worktrees で既存の worktree とその持ち主のチャットを探せる。ローカルの worktree サポートが必要で、タスク実行中は使えない"
